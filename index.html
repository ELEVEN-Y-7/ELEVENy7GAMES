<!DOCTYPE html>
<html>
<head>
    <title>Eleven-y-7</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-image: url('https://images3.alphacoders.com/132/1321959.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white; /* Ensures text is readable */
        }
        .game-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .game {
            margin: 10px;
            text-align: center;
            background: rgba(0, 0, 0, 0.7); /* Adds a slight background to make text more readable */
            padding: 10px;
            border-radius: 10px;
        }
        .game img {
            width: 150px;
            height: 150px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .game img:hover {
            transform: scale(1.1);
        }
        .game p {
            font-size: 16px;
            font-weight: bold;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Welcome to Eleven-y-7</h1>
    <div class="game-container">
        <div class="game">
            <a href="https://www.y8.com/games/football_legends_2021" target="_blank">
                <img src="https://img.y8.com/cloud/y8-thumbs/117991/big.jpg" alt="Football Legends 2021">
            </a>
            <p>Football Legends 2021</p>
        </div>
        <div class="game">
            <a href="https://www.y8.com/games/moto_x3m" target="_blank">
                <img src="https://img.y8.com/cloud/y8-thumbs/76971/big.gif" alt="Moto X3M">
            </a>
            <p>Moto X3M</p>
        </div>
        <div class="game">
            <a href="https://www.y8.com/games/fireboy_and_watergirl_5_elements" target="_blank">
                <img src="https://img.y8.com/cloud/y8-thumbs/100458/big.jpg" alt="Fireboy & Watergirl 5">
            </a>
            <p>Fireboy & Watergirl 5</p>
        </div>
        <div class="game">
            <a href="https://www.y8.com/games/asmr_beauty_homeless" target="_blank">
                <img src="https://img.y8.com/cloud/y8-thumbs/149599/big.jpg" alt="ASMR Beauty Homeless">
            </a>
            <p>ASMR Beauty Homeless</p>
        </div>
    </div>
</body>
</html>
